services:
  tunepick:
    image: "crpi-18u9lmp0sqaxuesr.cn-shenzhen.personal.cr.aliyuncs.com/cyccyc-music/tunepick:latest"
    pull_policy: always
    container_name: "tunepick"
    restart: "unless-stopped"
    ports:
      - "8091:8090"
    volumes:
      - "/vol1/@appshare/navidrome:/music:ro"
      - "./data:/data"
    environment:
      - "TZ=Asia/Shanghai"
      - "SOURCE_KIND=localfs"
      - "MUSIC_DIR=/music"
      - "DATA_DIR=/data"
      - "AUTH_TOKEN=cyccyccy"
      - "ADMIN_USER=admin"
      - "ADMIN_PASSWORD=admin"
      - "ONLINE_SOURCES=netease,caa"
      - "ONLINE_ENABLED=true"
      - "LLM_ENABLED=true"
      - "LLM_PROVIDER=deepseek"
      - "LLM_ENDPOINT=https://api.deepseek.com/chat/completions"
      - "LLM_API_KEY=sk-451059082fc84395a9b20251a3dd5181"
      - "LLM_MODEL=deepseek-flash"
      - "LLM_MAX_TOKENS=16384"
      # ---------- SqMusic 集成（在线搜歌下载）----------
      - "SQ_ENABLED=true"
      # ⚠️ 实测：直连后端容器 http://sqmusic_main:8099 会被后端返回 HTTP 400
      #     （后端只接受经它自己 nginx 转发过来的请求），
      #     走前端代理端口 8996 实测登录+搜索全部正常。
      #     若 NAS 内网 IP 变了（现在是 192.168.2.107），改这一行即可。
      - "SQ_BASE_URL=http://192.168.2.107:8996"
      - "SQ_USERNAME=admin"
      - "SQ_PASSWORD=admin"
      - "SQ_PLUGINS=kw,kg,qq,netease"
      - "SQ_BR_TYPE="
      - "SQ_AUTO_SCAN=true"
      - "SQ_TIMEOUT_MS=15000"
    # 说明：现在走宿主 IP + 前端代理端口（8996），
    # 不再需要把 TunePick 加进 SqMusic 的 sqmusic_sq-app-network 网络，
    # 少一层依赖、也不怕网络名对不上导致启动失败。
