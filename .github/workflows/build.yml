name: Build & Push (GHCR + Aliyun ACR)

# 推送到 main / 打 tag / 手动触发 时自动构建镜像。
# 双推：
#   - GHCR  ghcr.io/cyccyccy/tunepick          （多架构，海外备份）
#   - ACR   <阿里云地址>/<命名空间>/tunepick    （仅 amd64，国内拉取快，NAS 用这个）
# 阿里云地址/用户名/密码存在仓库 variables：ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # 形如 <owner>/tunepick

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推送 GHCR 必需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- GHCR：多架构 ----------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 仓库内置，无需额外配置

      - name: Metadata (GHCR)
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push (GHCR, multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 阿里云 ACR：仅 amd64（NAS 是 x86_64，且个人版对多架构索引支持不稳）----------
      - name: Log in to Aliyun ACR
        if: ${{ vars.ACR_REGISTRY != '' && vars.ACR_USERNAME != '' && vars.ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ vars.ACR_PASSWORD }}

      - name: Metadata (ACR)
        if: ${{ vars.ACR_REGISTRY != '' && vars.ACR_USERNAME != '' && vars.ACR_PASSWORD != '' }}
        id: meta_acr
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/tunepick
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push (ACR, amd64)
        if: ${{ vars.ACR_REGISTRY != '' && vars.ACR_USERNAME != '' && vars.ACR_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_acr.outputs.tags }}
          labels: ${{ steps.meta_acr.outputs.labels }}
          cache-from: type=gha
          # 阿里云个人版 ACR 不认 OCI provenance 证明清单，
          # 开了会报：denied: unknown manifest class for application/vnd.oci.empty.v1+json
          provenance: false
          sbom: false
